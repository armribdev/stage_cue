name: CI

# Vérifs légères sur chaque push et pull request : format, analyse statique, tests.
# Aucun build de plateforme ici (voir release.yml pour ça).
on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.44.1'
  FLUTTER_CHANNEL: 'stable'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      # Formatage exigé : corriger en local avec `dart format .` avant de commit.
      # Placé avant le stub et le codegen pour ne vérifier que les fichiers versionnés.
      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed .

      # google_oauth_secrets.dart est gitignoré (secrets locaux, absents du CI).
      # Stub vide pour que l'analyse/compilation passe.
      - name: Stub OAuth secrets
        run: cp lib/core/sync/google_oauth_secrets.example.dart lib/core/sync/google_oauth_secrets.dart
        shell: bash

      # Codegen Drift requis avant analyse/tests (les *.g.dart ne sont pas versionnés).
      - name: Codegen (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Échoue sur les erreurs, pas sur les warnings (du dead-code WIP existe).
      - name: Analyse statique
        run: dart analyze --no-fatal-warnings

      - name: Tests
        run: flutter test

  # Mêmes tests sur Windows, la plateforme réellement utilisée en prod : c'est
  # là que vivent les bugs déjà rencontrés (décodages SoLoud concurrents 0001,
  # ouverture DB au démarrage à froid 0013, WAL 0018, séparateurs de chemin).
  # Puis build de l'app et compilation de l'installeur Inno Setup, pour qu'une
  # régression de compilation native ou du script .iss casse la PR et pas la
  # release. Job séparé plutôt que matrice : le job Ubuntu garde son nom de
  # check et ses étapes à l'identique, sans `if: runner.os` à semer dedans.
  test-windows:
    name: Test & Installeur (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    # Un nouveau push sur une PR annule le run Windows obsolète (le plus lent) ;
    # sur main, chaque commit garde son run complet.
    concurrency:
      group: ${{ github.workflow }}-windows-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      # Pas de `dart format` ni de `dart analyze` ici : le résultat est identique
      # à Ubuntu, et le checkout Windows (core.autocrlf) convertit les fins de
      # ligne en CRLF, ce qui ferait échouer la vérification de formatage à tort.

      # google_oauth_secrets.dart est gitignoré (secrets locaux, absents du CI).
      # `cp` passe par Git Bash, présent sur les runners Windows.
      - name: Stub OAuth secrets
        run: cp lib/core/sync/google_oauth_secrets.example.dart lib/core/sync/google_oauth_secrets.dart
        shell: bash

      # Codegen Drift requis avant les tests (les *.g.dart ne sont pas versionnés).
      - name: Codegen (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Tests Dart/widget sur la VM hôte : pas de périphérique audio réel.
      # Placés avant le build : inutile de compiler du C++ si un test échoue.
      - name: Tests
        run: flutter test

      # Build de validation, non signé et sans secrets OAuth (le stub vide
      # suffit à compiler). Rien n'est publié : release.yml reste seul à
      # produire les artefacts de release.
      - run: flutter config --enable-windows-desktop

      # MSVC 14.51 (VS 18) du runner transforme en erreur l'usage de
      # <experimental/coroutine> par permission_handler_windows. La macro CL
      # (lue automatiquement par cl.exe) rétablit le comportement « warning ».
      - name: Build Windows (release)
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      # Installé explicitement, comme dans release.yml : on ne veut pas dépendre
      # silencieusement de sa préinstallation sur l'image du runner.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      # Version factice : aucun tag en CI. Le script lit le build ci-dessus
      # (build/windows/x64/runner/Release) et ISCC échoue si un chemin manque.
      - name: Compiler l'installeur (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=0.0.0-ci" windows\installer\stage_cue.iss
          if (-not (Test-Path "windows\installer\installer_output\StageCue-Setup-0.0.0-ci.exe")) {
            throw "Installeur introuvable après compilation"
          }
        shell: pwsh
