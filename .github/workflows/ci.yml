name: CI

# Vérifs légères sur chaque push et pull request : format, analyse statique, tests.
# Aucun build de plateforme ici (voir release.yml pour ça).
on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: '3.44.1'
  FLUTTER_CHANNEL: 'stable'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      # google_oauth_secrets.dart est gitignoré (secrets locaux, absents du CI).
      # Stub vide pour que l'analyse/compilation passe.
      - name: Stub OAuth secrets
        run: cp lib/core/sync/google_oauth_secrets.example.dart lib/core/sync/google_oauth_secrets.dart
        shell: bash

      # Codegen Drift requis avant analyse/tests (les *.g.dart ne sont pas versionnés).
      - name: Codegen (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Informatif seulement : le code n'est pas (encore) passé à `dart format`.
      # On signale les écarts sans bloquer le CI. Pour formater tout le projet
      # d'un coup, lancer en local : `dart format .`
      - name: Vérifier le formatage (non bloquant)
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true

      # Échoue sur les erreurs, pas sur les warnings (du dead-code WIP existe).
      - name: Analyse statique
        run: dart analyze --no-fatal-warnings

      - name: Tests
        run: flutter test
