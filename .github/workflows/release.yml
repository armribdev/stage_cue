name: Release

# Déclencheurs : push d'un tag "v*" (ex. v1.0.0) → build + GitHub Release,
# ou lancement manuel depuis l'onglet Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Version de Flutter partagée par tous les jobs (alignée sur le dev local).
env:
  FLUTTER_VERSION: '3.44.1'
  FLUTTER_CHANNEL: 'stable'

permissions:
  contents: write # nécessaire pour créer la GitHub Release

jobs:
  # ---------------------------------------------------------------------------
  # Android : APK (installable hors store) + AAB (format Play Store)
  # ---------------------------------------------------------------------------
  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
      - name: Stub OAuth secrets
        run: cp lib/core/sync/google_oauth_secrets.example.dart lib/core/sync/google_oauth_secrets.dart
        shell: bash
      - name: Codegen (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # NOTE signature : sans keystore, l'APK est signé avec la clé debug.
      # Pour un APK/AAB publiable, voir le bloc "Signature Android" en bas de fichier.
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS : build sans signature (--no-codesign). Artefact non installable tel
  # quel sur un device, mais valide la compilation. Voir "Signature iOS".
  # ---------------------------------------------------------------------------
  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get
      - name: Stub OAuth secrets
        run: cp lib/core/sync/google_oauth_secrets.example.dart lib/core/sync/google_oauth_secrets.dart
        shell: bash
      - name: Codegen (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build ios --release --no-codesign

      # Empaquette le .app non signé dans un .ipa (Payload/). Non installable
      # sans signature, mais utile pour archivage / tests internes.
      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -r app-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/ios/iphoneos/app-unsigned.ipa
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS : .app zippé (non notarisé → avertissement Gatekeeper à l'ouverture)
  # ---------------------------------------------------------------------------
  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Stub OAuth secrets
        run: cp lib/core/sync/google_oauth_secrets.example.dart lib/core/sync/google_oauth_secrets.dart
        shell: bash
      - name: Codegen (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Identifiants OAuth Drive injectés depuis les GitHub Secrets (le code lit
      # --dart-define en priorité sur google_oauth_secrets.dart, resté vide ici).
      - name: Build macOS (release)
        run: >
          flutter build macos --release
          --dart-define=GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          --dart-define=GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Zip .app
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -n1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" stage_cue-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/Build/Products/Release/stage_cue-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux : bundle complet en tar.gz. flutter_soloud nécessite ALSA (libasound2).
  # ---------------------------------------------------------------------------
  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libasound2-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Stub OAuth secrets
        run: cp lib/core/sync/google_oauth_secrets.example.dart lib/core/sync/google_oauth_secrets.dart
        shell: bash
      - name: Codegen (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux (release)
        run: >
          flutter build linux --release
          --dart-define=GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          --dart-define=GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Archive bundle
        run: tar -czf stage_cue-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: stage_cue-linux-x64.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows : dossier Release zippé
  # ---------------------------------------------------------------------------
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Stub OAuth secrets
        run: cp lib/core/sync/google_oauth_secrets.example.dart lib/core/sync/google_oauth_secrets.dart
        shell: bash
      - name: Codegen (Drift / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # MSVC 14.51 (VS 18) du runner transforme en erreur l'usage de
      # <experimental/coroutine> par permission_handler_windows. La macro CL
      # (lue automatiquement par cl.exe) rétablit le comportement « warning ».
      - name: Build Windows (release)
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: >
          flutter build windows --release
          --dart-define=GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          --dart-define=GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Zip Release folder
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath stage_cue-windows-x64.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: stage_cue-windows-x64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release : ne s'exécute que sur push d'un tag. Récupère tous les artefacts
  # des jobs précédents et crée une GitHub Release qui les attache.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [android, ios, macos, linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
